[package]
name = "nighterminal"
version = "0.1.0"
description = "Nighterminal — a neon-lit, frosted-glass terminal"
authors = ["Nighterminal"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nighterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
window-vibrancy = "0.6"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
